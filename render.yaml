services:
  - type: web
    name: sistema-convalidaciones
    env: python
    region: oregon
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 300 --keep-alive 5
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSLMODE
        value: require
